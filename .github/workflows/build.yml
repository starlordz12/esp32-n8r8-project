name: build

# Build-only CI. No flashing, no serial, no hardware-in-the-loop.
# See docs/PROJECT_GUIDE.md section 5 before changing this file.

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect toolchain
        id: detect
        run: |
          if [ -f platformio.ini ]; then
            echo "toolchain=platformio" >> "$GITHUB_OUTPUT"
          elif [ -f CMakeLists.txt ]; then
            echo "toolchain=esp-idf" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=none" >> "$GITHUB_OUTPUT"
          fi

      # --- PlatformIO -------------------------------------------------------
      - name: Set up Python
        if: steps.detect.outputs.toolchain == 'platformio'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        if: steps.detect.outputs.toolchain == 'platformio'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build (PlatformIO)
        if: steps.detect.outputs.toolchain == 'platformio'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pio run

      # --- ESP-IDF ----------------------------------------------------------
      # Gated on the IDF_VERSION repository variable: the IDF release is a
      # deliberate choice tied to the board, not something CI should assume.
      - name: Build (ESP-IDF)
        if: steps.detect.outputs.toolchain == 'esp-idf' && vars.IDF_VERSION != ''
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ vars.IDF_VERSION }}

      - name: ESP-IDF version not configured
        if: steps.detect.outputs.toolchain == 'esp-idf' && vars.IDF_VERSION == ''
        run: |
          echo "::error::CMakeLists.txt found but the IDF_VERSION repository variable is unset."
          echo "Set it under Settings > Secrets and variables > Actions > Variables."
          exit 1

      # --- Nothing to build yet --------------------------------------------
      - name: No firmware target configured
        if: steps.detect.outputs.toolchain == 'none'
        run: |
          echo "::notice::No platformio.ini or CMakeLists.txt found - nothing to build yet."
          echo "The board model has not been provided, so no firmware target exists."
          echo "See docs/PROJECT_GUIDE.md sections 3 and 4."
