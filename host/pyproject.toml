[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-csi-lab"
version = "0.1.0"
description = "Hardware-independent tools for ESP32 Wi-Fi CSI experiments"
requires-python = ">=3.11"

[project.scripts]
csi-lab-receive = "csi_lab.receiver:main"
csi-lab-simulate = "csi_lab.simulator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["csi_lab*"]
